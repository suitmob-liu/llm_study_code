services:
  gold:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.cloud.tencent.com/pypi/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    image: gold-analyzer:latest
    container_name: gold-analyzer
    ports:
      - "${PORT:-1012}:8000"
    environment:
      DATA_SOURCE: ${DATA_SOURCE:-auto}
      REFRESH_MINUTES: ${REFRESH_MINUTES:-5}
      PREDICT_INTERVAL_HOURS: ${PREDICT_INTERVAL_HOURS:-5}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # 服务器访问 Yahoo Finance 需要代理时填写
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1
    volumes:
      - gold_data:/data
    restart: unless-stopped

volumes:
  gold_data:
