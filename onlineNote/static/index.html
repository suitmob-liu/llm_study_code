<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Online Notes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login -->
    <div id="login-screen" class="screen">
        <div class="login-bg"><div class="shape s1"></div><div class="shape s2"></div><div class="shape s3"></div></div>
        <div class="login-card">
            <select id="login-lang" class="lang-sel login-lang-sel"><option value="zh-CN">简体中文</option><option value="en">English</option><option value="zh-TW">繁體中文</option></select>
            <div class="login-logo"><svg width="44" height="44" viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="12" fill="url(#lg)"/><path d="M14 14h14a4 4 0 014 4v16a2 2 0 01-2 2H16a2 2 0 01-2-2V14z" fill="rgba(255,255,255,.25)"/><path d="M18 22h12M18 27h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/><defs><linearGradient id="lg" x1="0" y1="0" x2="48" y2="48"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs></svg></div>
            <h1 data-i18n="app.title">Online Notes</h1>
            <p class="login-sub" data-i18n="app.subtitle">Your personal workspace</p>
            <form id="login-form">
                <div class="igroup"><svg class="iico" viewBox="0 0 20 20" fill="currentColor"><path d="M10 10a4 4 0 100-8 4 4 0 000 8zm-7 8a7 7 0 1114 0H3z"/></svg><input type="text" id="username" data-i18n-ph="login.username" placeholder="Username" required autocomplete="username"></div>
                <div class="igroup"><svg class="iico" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/></svg><input type="password" id="password" data-i18n-ph="login.password" placeholder="Password" required autocomplete="current-password"></div>
                <button type="submit" id="login-btn" data-i18n="login.submit">Sign In</button>
                <p id="login-error" class="error"></p>
            </form>
        </div>
    </div>

    <!-- App -->
    <div id="app-screen" class="screen" style="display:none">
        <header>
            <button id="menu-btn" class="mobile-only ico-btn" title="Menu"><svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 5h14a1 1 0 010 2H3a1 1 0 010-2zm0 4h14a1 1 0 010 2H3a1 1 0 010-2zm0 4h14a1 1 0 010 2H3a1 1 0 010-2z"/></svg></button>
            <div class="hdr-brand"><svg width="22" height="22" viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="12" fill="url(#hg)"/><path d="M14 14h14a4 4 0 014 4v16a2 2 0 01-2 2H16a2 2 0 01-2-2V14z" fill="rgba(255,255,255,.25)"/><path d="M18 22h12M18 27h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/><defs><linearGradient id="hg" x1="0" y1="0" x2="48" y2="48"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs></svg><h2 data-i18n="app.brand">Notes</h2></div>
            <div class="hdr-right">
                <div id="storage-widget" class="hdr-widget"><span id="storage-info">--</span><div class="st-bar"><div id="st-bar-fill" class="st-bar-fill"></div></div></div>
                <select id="app-lang" class="lang-sel"><option value="zh-CN">简体</option><option value="en">EN</option><option value="zh-TW">繁體</option></select>
                <div class="user-badge"><div class="user-av" id="user-av">U</div><span id="user-info" class="desk-only"></span></div>
                <button id="logout-btn" class="ico-btn" data-i18n-title="header.logout" title="Logout"><svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 001 1h5a1 1 0 100-2H4V5h4a1 1 0 100-2H3zm11.293 3.293a1 1 0 011.414 0l3 3a1 1 0 010 1.414l-3 3a1 1 0 01-1.414-1.414L15.586 11H8a1 1 0 110-2h7.586l-1.293-1.293a1 1 0 010-1.414z"/></svg></button>
            </div>
        </header>
        <div class="main-content">
            <aside id="sidebar">
                <div class="sb-top">
                    <div class="dropdown" id="new-dropdown">
                        <button id="new-btn" class="primary-btn"><svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"/></svg> <span data-i18n="sidebar.new">New</span></button>
                        <div class="dropdown-menu" id="new-menu">
                            <button data-action="new-text" data-i18n="sidebar.textNote">Text Note</button>
                            <button data-action="new-sheet" data-i18n="sidebar.spreadsheet">Spreadsheet</button>
                            <div class="dropdown-sep"></div>
                            <button data-action="tpl-daily" data-i18n="sidebar.dailyReport">Daily Report</button>
                            <button data-action="tpl-weekly" data-i18n="sidebar.weeklyReport">Weekly Report</button>
                        </div>
                    </div>
                    <div class="search-wrap"><svg class="s-ico" width="13" height="13" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"/></svg><input type="text" id="search-input" data-i18n-ph="sidebar.search" placeholder="Search..."></div>
                </div>
                <div class="folder-section">
                    <div class="folder-list" id="folder-list"></div>
                    <button id="add-folder-btn" class="add-folder-btn" data-i18n="sidebar.newFolder">+ New Folder</button>
                </div>
                <div class="sb-divider"></div>
                <div id="notes-list" class="notes-list"></div>
                <div class="sb-footer"><span id="note-count">0</span></div>
            </aside>
            <main id="editor">
                <div id="editor-empty" class="editor-empty">
                    <svg width="72" height="72" viewBox="0 0 80 80" fill="none" opacity=".12"><rect x="12" y="8" width="40" height="56" rx="6" stroke="currentColor" stroke-width="3"/><path d="M22 24h20M22 32h16M22 40h12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="56" cy="56" r="16" stroke="currentColor" stroke-width="3"/><path d="M56 48v16M48 56h16" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
                    <p data-i18n="editor.empty">Select a note or create a new one</p>
                </div>
                <!-- Text editor -->
                <div id="text-editor" class="editor-panel" style="display:none">
                    <div class="ed-header">
                        <input type="text" id="note-title" data-i18n-ph="editor.untitled" placeholder="Untitled...">
                        <div class="ed-actions">
                            <span id="save-status"></span>
                            <span id="char-count" class="muted small"></span>
                            <div class="dropdown" id="move-dropdown"><button class="ico-btn" data-i18n-title="editor.moveToFolder" title="Move to folder"><svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/></svg></button><div class="dropdown-menu" id="move-menu"></div></div>
                            <button id="del-btn" class="ico-btn danger-ico" data-i18n-title="editor.delete" title="Delete"><svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z"/></svg></button>
                            <button id="back-btn" class="ico-btn mobile-only" data-i18n-title="editor.back" title="Back"><svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"/></svg></button>
                        </div>
                    </div>
                    <textarea id="note-content" data-i18n-ph="editor.startWriting" placeholder="Start writing..."></textarea>
                </div>
                <!-- Sheet editor -->
                <div id="sheet-editor" class="editor-panel" style="display:none">
                    <div class="ed-header">
                        <input type="text" id="sheet-title" data-i18n-ph="editor.untitled" placeholder="Untitled...">
                        <div class="ed-actions">
                            <span id="sheet-save-status"></span>
                            <button id="sheet-add-row" class="sm-btn" data-i18n="editor.addRow">+ Row</button>
                            <button id="sheet-add-col" class="sm-btn" data-i18n="editor.addCol">+ Col</button>
                            <button id="sheet-del-row" class="sm-btn ghost" data-i18n="editor.delRow">- Row</button>
                            <button id="sheet-del-col" class="sm-btn ghost" data-i18n="editor.delCol">- Col</button>
                            <div class="dropdown" id="sheet-move-dropdown"><button class="ico-btn" data-i18n-title="editor.moveToFolder" title="Move to folder"><svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/></svg></button><div class="dropdown-menu" id="sheet-move-menu"></div></div>
                            <button id="sheet-del-btn" class="ico-btn danger-ico" data-i18n-title="editor.delete" title="Delete"><svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z"/></svg></button>
                            <button id="sheet-back-btn" class="ico-btn mobile-only" data-i18n-title="editor.back" title="Back"><svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"/></svg></button>
                        </div>
                    </div>
                    <div class="sheet-wrap" id="sheet-wrap"></div>
                </div>
            </main>
        </div>
    </div>
    <div id="toast" class="toast"></div>
    <script src="app.js"></script>
</body>
</html>
